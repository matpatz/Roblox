<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltex Scripts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/frontend/style.css">
</head>
<body>
<header class="topbar">
  <nav class="nav">
    <a href="/" class="brand">
      <img class="bolt" src="/assets/bolt.png" alt="" width="18" height="18">
      <span>VOLTEX</span>
    </a>
    <div class="links">
      <a href="/" class="active">Home</a>
      <a href="/projects">Projects</a>
      <a href="/stats">Stats</a>
    </div>
  </nav>
</header>
<main class="hero">
  <div class="hero-inner">
    <img class="hero-bolt" src="/assets/logo.png" alt="Voltex" width="52" height="52">
    <h1>Welcome to Voltex Scripts</h1>
    <p class="byline">by <span>matpatz</span> on Discord</p>
    <div class="live-badge" id="liveBadge">
      <span class="live-dot"></span>
      <span id="execCount">--</span> executions in the last hour
    </div>
    <div class="btn-row">
      <a class="discord-btn" href="https://discord.gg/bSPRYhBGtf" target="_blank" rel="noopener noreferrer">
        <img src="/assets/discord.png" alt="" width="20" height="20">
        Join the Discord server
      </a>
      <a class="discord-btn secondary" href="/projects">
        <img src="/assets/bolt.png" alt="" width="20" height="20">
        See Projects
      </a>
    </div>
  </div>
</main>
<script>
fetch('/api/v1/stats')
  .then(function(r) { return r.json(); })
  .then(function(d) {
    var data = d.data || d;
    document.getElementById('execCount').textContent = data.executions_last_hour || 0;
  })
  .catch(function() {});
</script>
</body>
</html>
