<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltex Scripts — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/frontend/style.css">
<link rel="stylesheet" href="/src/frontend/projects/style.css">
<script defer src="https://cdn.vercel-insights.com/v1/script.debug.js"></script>
</head>
<body>
<header class="topbar">
  <nav class="nav">
    <a href="/" class="brand">
      <img class="bolt" src="/assets/bolt.png" alt="" width="18" height="18">
      <span>VOLTEX</span>
    </a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/projects" class="active">Projects</a>
      <a href="/stats">Stats</a>
    </div>
  </nav>
</header>

<main class="picker">
  <div class="picker-inner">
    <p class="eyebrow">Projects</p>
    <h1>What do you want to see?</h1>
    <p class="picker-sub">Pick a category</p>

    <div class="options">
      <a class="option-card" href="/projects/scripts">
        <img src="/assets/bolt.png" alt="Scripts" width="22" height="22">
        <h2>Luau Scripts</h2>
        <p>General scripts, built to run in any game.</p>
      </a>

      <a class="option-card" href="/projects/games">
        <img src="/assets/logo.png" alt="Games" width="22" height="22">
        <h2>Luau Games</h2>
        <p>Scripts built to run in a targeted game.</p>
      </a>

      <a class="option-card" href="/projects/misc">
        <img src="/assets/misc.png" alt="Misc" width="22" height="22">
        <h2>Misc Projects</h2>
        <p>Everything else — obfuscators, tools, anything.</p>
      </a>
    </div>
  </div>
</main>

</body>
</html>
