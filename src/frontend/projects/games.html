<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltex Scripts — Luau Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/frontend/style.css">
<link rel="stylesheet" href="/src/frontend/projects/style.css">
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>

<header class="topbar">
  <nav class="nav">
    <a href="/" class="brand">
      <img class="bolt" src="/assets/bolt.png" alt="Voltex" width="18" height="18">
      <span>VOLTEX</span>
    </a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/projects" class="active">Projects</a>
      <a href="/stats">Stats</a>
    </div>
  </nav>
</header>

<main class="projects-container">
  <div class="projects-content">
    
    <div class="projects-top">
      <a href="/projects" class="back-link">← Back to Category Picker</a>
      <p class="eyebrow">Standalone Experiences</p>
      <h1>Luau Games</h1>
      <p class="picker-sub">Custom Roblox experiences and games engineered with Luau.</p>
    </div>

    <div class="controls-bar">
      <div class="search-box">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="Search games by title, tag, or description...">
      </div>

      <div class="filter-pills" id="filterGroup">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="In Development">In Development</button>
        <button class="pill" data-filter="Undetected">Undetected</button>
        <button class="pill" data-filter="Detected">Detected</button>
        <button class="pill" data-filter="Functional">Functional</button>
      </div>
    </div>

    <div class="project-grid" id="gameGrid">
      <p style="color: var(--muted); font-family: 'Inter', sans-serif;">Loading games data...</p>
    </div>

  </div>
</main>

<script>
let gamesData = [];
let currentFilter = 'all';

const searchInput = document.getElementById('searchInput');
const filterPills = document.querySelectorAll('.filter-pills .pill');
const gameGrid = document.getElementById('gameGrid');

// Helper to determine badge CSS class for a tag
function getBadgeClass(tag) {
  switch (tag) {
    case 'In Development':
      return 'badge-in-development';
    case 'Undetected':
      return 'badge-undetected';
    case 'Detected':
      return 'badge-detected';
    case 'Functional':
      return 'badge-functional';
    default:
      return 'badge-tag';
  }
}

// Render game cards dynamically from JSON array
function renderGames(games) {
  if (!games || games.length === 0) {
    gameGrid.innerHTML = `<p style="color: var(--muted); font-family: 'Inter', sans-serif; grid-column: 1/-1;">No games found matching your search criteria.</p>`;
    return;
  }

  gameGrid.innerHTML = games.map(game => {
    const tags = Array.isArray(game.tags) ? game.tags : [game.tags];
    const tagsDataAttr = tags.join(' ');
    
    const badgesHtml = tags.map(tag => `
      <span class="badge ${getBadgeClass(tag)}">${tag}</span>
    `).join('');

    const buttonClass = (game.tags && game.tags.includes('In Development')) ? 'action-btn secondary-btn' : 'action-btn';

    return `
      <div class="project-card" data-tags="${tagsDataAttr}">
        <div>
          <div class="card-head">
            <div class="card-title-group">
              <h3>${game.title}</h3>
              <p class="card-desc">${game.description}</p>
            </div>
          </div>
          <div class="badge-group" style="margin-top: 10px;">
            ${badgesHtml}
          </div>
        </div>

        <div>
          <div class="card-actions">
            <a class="${buttonClass}" href="${game.buttonUrl}" target="_blank" rel="noopener noreferrer">
              ${game.buttonText}
            </a>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// Filter and search handler
function filterAndRender() {
  const query = searchInput.value.toLowerCase().trim();

  const filtered = gamesData.filter(game => {
    const titleMatch = game.title.toLowerCase().includes(query);
    const descMatch = game.description.toLowerCase().includes(query);
    const tagsMatch = game.tags.some(t => t.toLowerCase().includes(query));
    const matchesSearch = query === '' || titleMatch || descMatch || tagsMatch;

    const matchesFilter = currentFilter === 'all' || game.tags.includes(currentFilter);

    return matchesSearch && matchesFilter;
  });

  renderGames(filtered);
}

// Load JSON data
async function loadGamesJSON() {
  const paths = [
    '/src/frontend/projects/games.json',
    './games.json',
    '/projects/games.json'
  ];

  for (const path of paths) {
    try {
      const response = await fetch(path);
      if (response.ok) {
        gamesData = await response.json();
        renderGames(gamesData);
        return;
      }
    } catch (err) {
      console.warn(`Failed to fetch from ${path}:`, err);
    }
  }
  
  gameGrid.innerHTML = `<p style="color: #ff5252; font-family: 'Inter', sans-serif; grid-column: 1/-1;">Error loading games.json</p>`;
}

// Event Listeners
filterPills.forEach(pill => {
  pill.addEventListener('click', () => {
    filterPills.forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    currentFilter = pill.getAttribute('data-filter');
    filterAndRender();
  });
});

searchInput.addEventListener('input', filterAndRender);

// Initialize
loadGamesJSON();
</script>
</body>
</html>
