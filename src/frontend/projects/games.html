<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltex Scripts — Luau Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/frontend/style.css">
<link rel="stylesheet" href="/src/frontend/projects/style.css">
</head>
<body>
<header class="topbar">
  <nav class="nav">
    <a href="/" class="brand">
      <img class="bolt" src="/assets/bolt.png" alt="Voltex" width="18" height="18">
      <span>VOLTEX</span>
    </a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/projects" class="active">Projects</a>
      <a href="/stats">Stats</a>
    </div>
  </nav>
</header>

<main class="projects-container">
  <div class="projects-content">
    
    <div class="projects-top">
      <a href="/projects" class="back-link"> <- Back to Category Picker</a>
      <h1>Luau Games</h1>
      <p class="picker-sub">Custom Roblox experiences and scripts engineered with Luau.</p>
    </div>

    <div class="controls-bar">
      <div class="search-box">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="Search games by title, tag, or description...">
      </div>

      <div class="filter-pills" id="filterGroup">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="In Development">In Development</button>
        <button class="pill" data-filter="Undetected">Undetected</button>
        <button class="pill" data-filter="Detected">Detected</button>
        <button class="pill" data-filter="Functional">Functional</button>
      </div>
    </div>

    <div class="project-grid" id="gameGrid">
      <p style="color: var(--muted); font-family: 'Inter', sans-serif;">Loading games data...</p>
    </div>

  </div>
</main>

<div class="toast" id="toast">Copied script loadstring to clipboard!</div>

<script>
let gamesData = [];
let currentFilter = 'all';

const searchInput = document.getElementById('searchInput');
const filterPills = document.querySelectorAll('.filter-pills .pill');
const gameGrid = document.getElementById('gameGrid');

function escapeHtml(text) {
  if (!text) return '';
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function copyCode(text) {
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2400);
  });
}

function getBadgeClass(tag) {
  switch (tag) {
    case 'In Development':
      return 'badge-in-development';
    case 'Undetected':
      return 'badge-undetected';
    case 'Detected':
      return 'badge-detected';
    case 'Functional':
      return 'badge-functional';
    default:
      return 'badge-tag';
  }
}

function renderGames(games) {
  if (!games || games.length === 0) {
    gameGrid.innerHTML = `<p style="color: var(--muted); font-family: 'Inter', sans-serif; grid-column: 1/-1;">No games found matching your search criteria.</p>`;
    return;
  }

  gameGrid.innerHTML = games.map(game => {
    const tags = Array.isArray(game.tags) ? game.tags : (game.tags ? [game.tags] : []);
    const tagsDataAttr = tags.join(' ');
    
    const badgesHtml = tags.map(tag => `
      <span class="badge ${getBadgeClass(tag)}">${tag}</span>
    `).join('');

    const updatedHtml = game.updated ? `<span class="update-time">Updated ${game.updated}</span>` : '';
    const loadstringCode = game.loadstring || `loadstring(game:HttpGet("https://website-iota-ivory-12.vercel.app/code/games/${game.id}/main.lua"))()`;
    const escapedCode = escapeHtml(loadstringCode);

    const playBtnHtml = game.playUrl 
      ? `<a class="action-btn secondary-btn" href="${game.playUrl}" target="_blank" rel="noopener noreferrer">${game.playButtonText || 'Play on Roblox'}</a>` 
      : '';

    return `
      <div class="project-card" data-tags="${tagsDataAttr}">
        <div>
          <div class="card-head">
            <div class="card-title-group">
              <h3>${game.title}</h3>
              <p class="card-desc">${game.description}</p>
              ${updatedHtml}
            </div>
          </div>
          <div class="badge-group" style="margin-top: 10px;">
            ${badgesHtml}
          </div>
        </div>

        <div>
          <div class="code-box">
            <code>${escapedCode}</code>
          </div>
          <div class="card-actions">
            <button class="action-btn" onclick="copyCode(this.getAttribute('data-code'))" data-code="${escapedCode}">
              ${game.buttonText || 'Get Script'}
            </button>
            ${playBtnHtml}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function filterAndRender() {
  const query = searchInput.value.toLowerCase().trim();

  const filtered = gamesData.filter(game => {
    const titleMatch = game.title.toLowerCase().includes(query);
    const descMatch = game.description.toLowerCase().includes(query);
    const tagsMatch = game.tags ? game.tags.some(t => t.toLowerCase().includes(query)) : false;
    const updatedMatch = game.updated ? game.updated.toLowerCase().includes(query) : false;
    const matchesSearch = query === '' || titleMatch || descMatch || tagsMatch || updatedMatch;

    const matchesFilter = currentFilter === 'all' || (game.tags && game.tags.includes(currentFilter));

    return matchesSearch && matchesFilter;
  });

  renderGames(filtered);
}

async function loadGamesJSON() {
  try {
    const response = await fetch('/api/v1/games?limit=100');
    if (response.ok) {
      const result = await response.json();
      gamesData = result.data || [];
      renderGames(gamesData);
      return;
    }
  } catch (err) {
    console.warn('API fetch failed, falling back to static:', err);
  }

  const paths = ['/src/frontend/projects/games.json', './games.json', '/projects/games.json'];
  for (const path of paths) {
    try {
      const response = await fetch(path);
      if (response.ok) {
        gamesData = await response.json();
        renderGames(gamesData);
        return;
      }
    } catch (err) {}
  }

  gameGrid.innerHTML = `<p style="color: #ff5252; font-family: 'Inter', sans-serif; grid-column: 1/-1;">Error loading games</p>`;
}

filterPills.forEach(pill => {
  pill.addEventListener('click', () => {
    filterPills.forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    currentFilter = pill.getAttribute('data-filter');
    filterAndRender();
  });
});

searchInput.addEventListener('input', filterAndRender);

loadGamesJSON();
</script>
</body>
</html>
