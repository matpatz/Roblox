<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltex Scripts — Misc Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/frontend/style.css">
<link rel="stylesheet" href="/src/frontend/projects/style.css">
</head>
<body>
<header class="topbar">
  <nav class="nav">
    <a href="/" class="brand">
      <img class="bolt" src="/assets/bolt.png" alt="Voltex" width="18" height="18">
      <span>VOLTEX</span>
    </a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/projects" class="active">Projects</a>
      <a href="/stats">Stats</a>
    </div>
  </nav>
</header>

<main class="projects-container">
  <div class="projects-content">
    
    <div class="projects-top">
      <a href="/projects" class="back-link">← Back to Category Picker</a>
      <p class="eyebrow">Tools & Utilities</p>
      <h1>Misc Projects</h1>
      <p class="picker-sub">Developer tools, security modules, APIs, and experimental scripts.</p>
    </div>

    <div class="controls-bar">
      <div class="search-box">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="Search tools and experiments...">
      </div>
    </div>

    <div class="project-grid" id="miscGrid">
      <p style="color: var(--muted); font-family: 'Inter', sans-serif;">Loading misc projects data...</p>
    </div>

  </div>
</main>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
let miscData = [];

const searchInput = document.getElementById('searchInput');
const miscGrid = document.getElementById('miscGrid');

function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function copyCode(text) {
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2400);
  });
}

function renderMiscProjects(projects) {
  if (!projects || projects.length === 0) {
    miscGrid.innerHTML = `<p style="color: var(--muted); font-family: 'Inter', sans-serif; grid-column: 1/-1;">No projects found matching your search.</p>`;
    return;
  }

  miscGrid.innerHTML = projects.map(item => {
    const escapedSnippet = escapeHtml(item.snippet);
    const rawLinkHtml = item.rawUrl 
      ? `<a class="action-btn secondary-btn" href="${item.rawUrl}" target="_blank" rel="noopener noreferrer">View File</a>` 
      : '';

    return `
      <div class="project-card">
        <div>
          <div class="card-head">
            <div class="card-title-group">
              <h3>${item.title}</h3>
              <p class="card-desc">${item.description}</p>
            </div>
          </div>
        </div>

        <div>
          <div class="code-box">
            <code>${escapedSnippet}</code>
          </div>
          <div class="card-actions">
            <button class="action-btn" onclick="copyCode(this.getAttribute('data-code'))" data-code="${escapedSnippet}">
              ${item.buttonText || '⚡ Copy Snippet'}
            </button>
            ${rawLinkHtml}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function filterAndRender() {
  const query = searchInput.value.toLowerCase().trim();

  const filtered = miscData.filter(item => {
    const titleMatch = item.title.toLowerCase().includes(query);
    const descMatch = item.description.toLowerCase().includes(query);
    const snippetMatch = item.snippet.toLowerCase().includes(query);

    return query === '' || titleMatch || descMatch || snippetMatch;
  });

  renderMiscProjects(filtered);
}

async function loadMiscJSON() {
  const paths = [
    '/src/frontend/projects/misc.json',
    './misc.json',
    '/projects/misc.json'
  ];

  for (const path of paths) {
    try {
      const response = await fetch(path);
      if (response.ok) {
        miscData = await response.json();
        renderMiscProjects(miscData);
        return;
      }
    } catch (err) {
      console.warn(`Failed to fetch from ${path}:`, err);
    }
  }
  
  miscGrid.innerHTML = `<p style="color: #ff5252; font-family: 'Inter', sans-serif; grid-column: 1/-1;">Error loading misc.json</p>`;
}

searchInput.addEventListener('input', filterAndRender);

loadMiscJSON();
</script>
</body>
</html>
