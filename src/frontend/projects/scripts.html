<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltex Scripts — Luau Scripts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/frontend/style.css">
<link rel="stylesheet" href="/src/frontend/projects/style.css">
<script defer src="https://cdn.vercel-insights.com/v1/script.debug.js"></script>
</head>
<body>
<header class="topbar">
  <nav class="nav">
    <a href="/" class="brand">
      <img class="bolt" src="/assets/bolt.png" alt="Voltex" width="18" height="18">
      <span>VOLTEX</span>
    </a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/projects" class="active">Projects</a>
      <a href="/stats">Stats</a>
    </div>
  </nav>
</header>

<main class="projects-container">
  <div class="projects-content">
    
    <div class="projects-top">
      <a href="/projects" class="back-link"><- Back to Category Picker</a>
      <h1>Luau Scripts</h1>
      <p class="picker-sub">Feature-rich scripts engineered for maximum execution stability and speed.</p>
    </div>

    <div class="controls-bar">
      <div class="search-box">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="Search scripts by title or description...">
      </div>

      <div class="filter-pills" id="filterGroup">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="Open Source">Open Source</button>
      </div>
    </div>

    <div class="project-grid" id="scriptGrid">
      <p style="color: var(--muted); font-family: 'Inter', sans-serif;">Loading scripts data...</p>
    </div>

  </div>
</main>

<div class="toast" id="toast">Copied loadstring to clipboard!</div>

<script>
let scriptsData = [];
let currentFilter = 'all';

const searchInput = document.getElementById('searchInput');
const filterPills = document.querySelectorAll('.filter-pills .pill');
const scriptGrid = document.getElementById('scriptGrid');

function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function copyCode(text) {
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2400);
  });
}

function getBadgeClass(tag) {
  switch (tag) {
    case 'Open Source':
      return 'badge-undetected';
    default:
      return 'badge-tag';
  }
}

function renderScripts(scripts) {
  if (!scripts || scripts.length === 0) {
    scriptGrid.innerHTML = `<p style="color: var(--muted); font-family: 'Inter', sans-serif; grid-column: 1/-1;">No scripts found matching your search.</p>`;
    return;
  }

  scriptGrid.innerHTML = scripts.map(script => {
    const escapedLoadstring = escapeHtml(script.loadstring);
    const rawLinkHtml = script.rawUrl 
      ? `<a class="action-btn secondary-btn" href="${script.rawUrl}" target="_blank" rel="noopener noreferrer">View Raw</a>` 
      : '';
    const updatedHtml = script.updated ? `<span class="update-time">Updated ${script.updated}</span>` : '';
    const tags = Array.isArray(script.tags) ? script.tags : [];
    const badgesHtml = tags.map(tag => `<span class="badge ${getBadgeClass(tag)}">${tag}</span>`).join('');

    return `
      <div class="project-card">
        <div>
          <div class="card-head">
            <div class="card-title-group">
              <h3>${script.title}</h3>
              <p class="card-desc">${script.description}</p>
              ${updatedHtml}
            </div>
          </div>
          ${badgesHtml ? `<div class="badge-group" style="margin-top: 10px;">${badgesHtml}</div>` : ''}
        </div>

        <div>
          <div class="code-box">
            <code>${escapedLoadstring}</code>
          </div>
          <div class="card-actions">
            <button class="action-btn" onclick="copyCode(this.getAttribute('data-code'))" data-code="${escapedLoadstring}">
              ${script.buttonText || 'Copy Loadstring'}
            </button>
            ${rawLinkHtml}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function filterAndRender() {
  const query = searchInput.value.toLowerCase().trim();

  const filtered = scriptsData.filter(script => {
    const titleMatch = script.title.toLowerCase().includes(query);
    const descMatch = script.description.toLowerCase().includes(query);
    const codeMatch = script.loadstring.toLowerCase().includes(query);
    const updatedMatch = script.updated ? script.updated.toLowerCase().includes(query) : false;
    const tagsMatch = script.tags ? script.tags.some(t => t.toLowerCase().includes(query)) : false;
    const matchesSearch = query === '' || titleMatch || descMatch || codeMatch || updatedMatch || tagsMatch;

    const matchesFilter = currentFilter === 'all' || (script.tags && script.tags.includes(currentFilter));

    return matchesSearch && matchesFilter;
  });

  renderScripts(filtered);
}

async function loadScriptsJSON() {
  try {
    const response = await fetch('/api/v1/scripts?limit=100');
    if (response.ok) {
      const result = await response.json();
      scriptsData = result.data || [];
      renderScripts(scriptsData);
      return;
    }
  } catch (err) {
    console.warn('API fetch failed, falling back to static:', err);
  }

  const paths = ['/src/frontend/projects/scripts.json', './scripts.json', '/projects/scripts.json'];
  for (const path of paths) {
    try {
      const response = await fetch(path);
      if (response.ok) {
        scriptsData = await response.json();
        renderScripts(scriptsData);
        return;
      }
    } catch (err) {}
  }

  scriptGrid.innerHTML = `<p style="color: #ff5252; font-family: 'Inter', sans-serif; grid-column: 1/-1;">Error loading scripts</p>`;
}

searchInput.addEventListener('input', filterAndRender);

filterPills.forEach(pill => {
  pill.addEventListener('click', () => {
    filterPills.forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    currentFilter = pill.getAttribute('data-filter');
    filterAndRender();
  });
});

loadScriptsJSON();
</script>
</body>
</html>
