<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltex Scripts — System Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/frontend/style.css">
<link rel="stylesheet" href="/src/frontend/stats.css">
</head>
<body>

<header class="topbar">
  <nav class="nav">
    <a href="/" class="brand">
      <img class="bolt" src="/assets/bolt.png" alt="Voltex" width="18" height="18">
      <span>VOLTEX</span>
    </a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/projects">Projects</a>
      <a href="/stats" class="active">Stats</a>
    </div>
  </nav>
</header>

<main class="stats-container">
  <div class="stats-inner">
    <div class="stats-header">
      <p class="eyebrow" style="margin-bottom: 8px;">Real-time Telemetry</p>
      <h1>System & Usage Stats</h1>
      <p class="byline">Live metrics for Voltex scripts, executions, and network uptime.</p>
    </div>

    <div class="stats-grid" id="statsGrid"></div>
  </div>
</main>

<script>
var statsGrid = document.getElementById('statsGrid');

function renderStats(data) {
  var discord = data.discord_community || {};
  var memberCount = discord.presence_count || discord.member_count || 0;

  var stats = [
    { label: 'Total Executions', value: data.total_executions || 0, description: 'Successful loadstring executions across all games.' },
    { label: 'Active Users', value: data.active_users || 0, description: 'Monthly unique Roblox users leveraging Voltex.' },
    { label: 'API Status', value: data.api_status || 'Unknown', small: true },
    { label: 'Discord Community', value: memberCount, description: 'Members on the official Voltex Discord.' }
  ];

  statsGrid.innerHTML = stats.map(function(stat) {
    var numberStyle = stat.small ? ' style="font-size: 28px;"' : '';
    var descHtml = stat.description ? '<div class="stat-desc">' + stat.description + '</div>' : '';
    return '<div class="stat-card"><div class="stat-label">' + stat.label + '</div><div class="stat-number"' + numberStyle + '>' + stat.value + '</div>' + descHtml + '</div>';
  }).join('');
}

renderStats({ total_executions: 0, active_users: 0, api_status: 'Unknown', discord_community: {} });

var controller = new AbortController();
var timer = setTimeout(function() { controller.abort(); }, 8000);

fetch('/api/stats', { signal: controller.signal })
  .then(function(res) {
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  })
  .then(function(data) { renderStats(data); })
  .catch(function(err) { console.warn('Stats API:', err.message); });
</script>
</body>
</html>
