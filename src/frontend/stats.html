<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltex Scripts — System Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/frontend/style.css">
<link rel="stylesheet" href="/src/frontend/stats.css">
</head>
<body>

<header class="topbar">
  <nav class="nav">
    <a href="/" class="brand">
      <img class="bolt" src="/assets/bolt.png" alt="Voltex" width="18" height="18">
      <span>VOLTEX</span>
    </a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/projects">Projects</a>
      <a href="/stats" class="active">Stats</a>
    </div>
  </nav>
</header>

<main class="stats-container">
  <div class="stats-inner">
    <div class="stats-header">
      <p class="eyebrow" style="margin-bottom: 8px;">Real-time Telemetry</p>
      <h1>System & Usage Stats</h1>
      <p class="byline">Live metrics for Voltex scripts, executions, and network uptime.</p>
    </div>

    <div class="stats-grid" id="statsGrid">
      <p style="color: var(--muted); font-family: 'Inter', sans-serif; grid-column: 1/-1;">Loading stats...</p>
    </div>
  </div>
</main>

<script>
const statsGrid = document.getElementById('statsGrid');

function formatNumber(n) {
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return String(n);
}

function renderStats(data) {
  const discord = data.discord_community || {};
  const memberCount = discord.presence_count || discord.member_count || 0;

  const stats = [
    {
      label: 'Total Executions',
      value: formatNumber(data.total_executions),
      description: 'Successful loadstring executions across all games.'
    },
    {
      label: 'Active Users',
      value: formatNumber(data.active_users),
      description: 'Monthly unique Roblox users leveraging Voltex.'
    },
    {
      label: 'API Status',
      value: data.api_status,
      small: true
    },
    {
      label: 'Discord Community',
      value: formatNumber(memberCount),
      description: 'Members on the official Voltex Discord.'
    }
  ];

  statsGrid.innerHTML = stats.map(stat => {
    const numberStyle = stat.small ? ' style="font-size: 28px;"' : '';
    const descHtml = stat.description ? `<div class="stat-desc">${stat.description}</div>` : '';

    return `
      <div class="stat-card">
        <div class="stat-label">${stat.label}</div>
        <div class="stat-number"${numberStyle}>${stat.value}</div>
        ${descHtml}
      </div>
    `;
  }).join('');
}

async function loadStats() {
  try {
    const response = await fetch('/api/stats');
    console.log('Stats response:', response.status, response.statusText);
    if (response.ok) {
      const data = await response.json();
      renderStats(data);
      return;
    }
  } catch (err) {
    console.warn('Failed to fetch stats:', err);
  }

  statsGrid.innerHTML = `<p style="color: #ff5252; font-family: 'Inter', sans-serif; grid-column: 1/-1;">Error loading stats.</p>`;
}

loadStats();
</script>
</body>
</html>
