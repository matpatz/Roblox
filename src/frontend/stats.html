<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltex Scripts — System Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/frontend/style.css">
<link rel="stylesheet" href="/src/frontend/stats.css">
</head>
<body>

<header class="topbar">
  <nav class="nav">
    <a href="/" class="brand">
      <img class="bolt" src="/assets/bolt.png" alt="Voltex" width="18" height="18">
      <span>VOLTEX</span>
    </a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/projects">Projects</a>
      <a href="/stats" class="active">Stats</a>
    </div>
  </nav>
</header>

<main class="stats-container">
  <div class="stats-inner">
    <div class="stats-header">
      <h1>Usage Stats</h1>
      <p class="byline">Metrics for Voltex scripts, executions, and such.</p>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="graph-section" id="graphSection">
      <div class="graph-header">
        <h2>Executions (Last 7 Days)</h2>
      </div>
      <div class="graph-container" id="execGraph"></div>
    </div>
  </div>
</main>

<script>
var statsGrid = document.getElementById('statsGrid');
var graphSection = document.getElementById('graphSection');
var execGraph = document.getElementById('execGraph');

function renderStats(data) {
  var discord = data.discord_community || {};
  var memberCount = discord.member_count || discord.presence_count || 0;

  var stats = [
    { label: 'Total Executions', value: data.total_executions || 0, description: 'Successful loadstring executions across all games.' },
    { label: 'Active Users', value: data.active_users || 0, description: 'Monthly unique Roblox users leveraging Voltex.' },
    { label: 'API Status', value: data.api_status || 'Unknown', small: true },
    { label: 'Discord Community', value: memberCount, description: 'Members on the official Voltex Discord.' }
  ];

  statsGrid.innerHTML = stats.map(function(stat) {
    var numberStyle = stat.small ? ' style="font-size: 28px;"' : '';
    var descHtml = stat.description ? '<div class="stat-desc">' + stat.description + '</div>' : '';
    return '<div class="stat-card"><div class="stat-label">' + stat.label + '</div><div class="stat-number"' + numberStyle + '>' + stat.value + '</div>' + descHtml + '</div>';
  }).join('');
}

function renderGraph(history) {
  if (!history || history.length === 0) {
    var dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var emptyHtml = '';
    for (var i = 6; i >= 0; i--) {
      var d = new Date();
      d.setDate(d.getDate() - i);
      var label = dayLabels[d.getDay()] + ' ' + d.getDate();
      emptyHtml += '<div class="graph-bar-wrap">' +
        '<div class="graph-bar-value">0</div>' +
        '<div class="graph-bar" style="height: 2%;"></div>' +
        '<div class="graph-bar-label">' + label + '</div>' +
      '</div>';
    }
    execGraph.innerHTML = '<div class="graph-bars">' + emptyHtml + '</div>';
    return;
  }

  var maxCount = Math.max.apply(null, history.map(function(d) { return d.count; }));
  if (maxCount === 0) maxCount = 1;

  var dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  var barsHtml = history.map(function(entry) {
    var pct = (entry.count / maxCount) * 100;
    var d = new Date(entry.date + 'T00:00:00');
    var label = dayLabels[d.getDay()] + ' ' + d.getDate();
    return '<div class="graph-bar-wrap">' +
      '<div class="graph-bar-value">' + entry.count + '</div>' +
      '<div class="graph-bar" style="height: ' + Math.max(pct, 2) + '%;"></div>' +
      '<div class="graph-bar-label">' + label + '</div>' +
    '</div>';
  }).join('');

  execGraph.innerHTML = '<div class="graph-bars">' + barsHtml + '</div>';
}

var cached = null;
try { cached = JSON.parse(sessionStorage.getItem('stats_cache')); } catch(e) {}
if (cached) {
  renderStats(cached);
  if (cached.execution_history) renderGraph(cached.execution_history);
}

var controller = new AbortController();
var timer = setTimeout(function() { controller.abort(); }, 8000);

fetch('/api/v1/stats', { signal: controller.signal })
  .then(function(res) {
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  })
  .then(function(json) {
    var data = json.data || json;
    renderStats(data);
    if (data.execution_history) renderGraph(data.execution_history);
    try { sessionStorage.setItem('stats_cache', JSON.stringify(data)); } catch(e) {}
  })
  .catch(function(err) { console.warn('Stats API:', err.message); });
</script>
</body>
</html>
