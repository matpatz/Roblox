<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltex Scripts — System Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/frontend/style.css">
<link rel="stylesheet" href="/src/frontend/stats.css">
</head>
<body>

<header class="topbar">
  <nav class="nav">
    <a href="/" class="brand">
      <img class="bolt" src="/assets/bolt.png" alt="Voltex" width="18" height="18">
      <span>VOLTEX</span>
    </a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/projects">Projects</a>
      <a href="/stats" class="active">Stats</a>
    </div>
  </nav>
</header>

<main class="stats-container">
  <div class="stats-inner">
    <div class="stats-header">
      <h1>Usage Stats</h1>
      <p class="byline">Metrics for Voltex scripts, executions, and such.</p>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="graph-section" id="graphSection">
      <div class="graph-header">
        <h2>Executions (Last 7 Days)</h2>
      </div>
      <div class="graph-container" id="execGraph"></div>
    </div>
  </div>
</main>

<script>
const statsGrid = document.getElementById('statsGrid');
const graphSection = document.getElementById('graphSection');
const execGraph = document.getElementById('execGraph');

function renderStats(data) {
  const discord = data.discord_community || {};
  const memberCount = discord.member_count || discord.presence_count || 0;

  const stats = [
    { label: 'Total Executions', value: data.total_executions || 0, description: 'Successful loadstring executions across all games.' },
    { label: 'Active Users', value: data.active_users || 0, description: 'Monthly unique Roblox users leveraging Voltex.' },
    { label: 'API Status', value: data.api_status || 'Unknown', small: true },
    { label: 'Discord Community', value: memberCount, description: 'Members on the official Voltex Discord.' }
  ];

  statsGrid.innerHTML = '';
  stats.forEach(function(stat) {
    const card = document.createElement('div');
    card.className = 'stat-card';
    const label = document.createElement('div');
    label.className = 'stat-label';
    label.textContent = stat.label;
    card.appendChild(label);
    const num = document.createElement('div');
    num.className = 'stat-number';
    if (stat.small) num.style.fontSize = '28px';
    num.textContent = String(stat.value);
    card.appendChild(num);
    if (stat.description) {
      const desc = document.createElement('div');
      desc.className = 'stat-desc';
      desc.textContent = stat.description;
      card.appendChild(desc);
    }
    statsGrid.appendChild(card);
  });
}

function renderGraph(history) {
  const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  let entries = [];

  if (!history || history.length === 0) {
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      entries.push({ label: dayLabels[d.getDay()] + ' ' + d.getDate(), count: 0 });
    }
  } else {
    entries = history.map(function(entry) {
      const d = new Date(entry.date + 'T00:00:00');
      return { label: dayLabels[d.getDay()] + ' ' + d.getDate(), count: entry.count };
    });
  }

  let maxCount = Math.max.apply(null, entries.map(function(e) { return e.count; }));
  if (maxCount === 0) maxCount = 1;

  const bars = document.createElement('div');
  bars.className = 'graph-bars';
  entries.forEach(function(entry) {
    const wrap = document.createElement('div');
    wrap.className = 'graph-bar-wrap';
    const val = document.createElement('div');
    val.className = 'graph-bar-value';
    val.textContent = String(entry.count);
    wrap.appendChild(val);
    const bar = document.createElement('div');
    bar.className = 'graph-bar';
    bar.style.height = Math.max((entry.count / maxCount) * 100, 2) + '%';
    wrap.appendChild(bar);
    const lbl = document.createElement('div');
    lbl.className = 'graph-bar-label';
    lbl.textContent = entry.label;
    wrap.appendChild(lbl);
    bars.appendChild(wrap);
  });

  execGraph.innerHTML = '';
  execGraph.appendChild(bars);
}

let cached = null;
try { cached = JSON.parse(localStorage.getItem('stats_cache')); } catch(e) {}
if (cached) {
  renderStats(cached);
  if (cached.execution_history) renderGraph(cached.execution_history);
}

const controller = new AbortController();
const timer = setTimeout(function() { controller.abort(); }, 8000);

fetch('/api/v1/stats', { signal: controller.signal })
  .then(function(res) {
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  })
  .then(function(json) {
    const data = json.data || json;
    renderStats(data);
    if (data.execution_history) renderGraph(data.execution_history);
    try { localStorage.setItem('stats_cache', JSON.stringify(data)); } catch(e) {}
  })
  .catch(function(err) { console.warn('Stats API:', err.message); });
</script>
</body>
</html>
